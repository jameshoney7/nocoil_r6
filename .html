<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R6 Script</title>

  <style>
    /* --- CYBERPUNK THEME STYLING --- */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      color: #00ffea;
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* Glowing grid background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, rgba(0,255,234,0.05) 1px, transparent 1px),
        linear-gradient(rgba(0,255,234,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      animation: moveGrid 20s linear infinite;
    }

    @keyframes moveGrid {
      from { background-position: 0 0, 0 0; }
      to { background-position: 100px 100px, 100px 100px; }
    }

    header {
      text-align: center;
      padding: 120px 20px;
      position: relative;
    }

    h1 {
      font-size: 4em;
      color: #00fff6;
      text-shadow: 0 0 10px #00fff6, 0 0 20px #00fff6, 0 0 40px #008f89;
      letter-spacing: 4px;
      display: inline-block;
      animation: glitch 2.5s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      20% { text-shadow: -2px 0 red, 2px 0 blue; }
      40% { text-shadow: 2px 2px red, -2px -2px blue; }
      60% { text-shadow: -2px -2px red, 2px 2px blue; }
      80% { text-shadow: 2px -2px red, -2px 2px blue; }
      100% { text-shadow: 2px 0 red, -2px 0 blue; }
    }

    section {
      max-width: 800px;
      margin: 60px auto;
      text-align: center;
      padding: 0 20px;
    }

    p {
      font-size: 1.1em;
      color: #b0fff8;
      line-height: 1.6em;
    }

    .download-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 40px;
      font-size: 1.2em;
      color: #00ffea;
      border: 2px solid #00ffea;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px #00fff6;
    }

    .download-btn:hover {
      background: #00ffea;
      color: #050505;
      box-shadow: 0 0 20px #00ffea, 0 0 40px #00ffea;
    }

    .screenshots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .screenshots img {
      width: 280px;
      height: 160px;
      object-fit: cover;
      border: 2px solid #00ffea;
      border-radius: 6px;
      box-shadow: 0 0 10px #00ffea;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .screenshots img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00ffea, 0 0 50px #00ffea;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.9em;
      color: #00ffea;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <header>
    <h1>R6 SCRIPT</h1>
    <p>Cyber-enhanced gaming utility — efficient, fast, and built for performance.<br>
    (Edit this description with your own game info!)</p>
    <a href="#" class="download-btn">Download Now</a>
  </header>

  <section id="screenshots">
    <h2>Preview</h2>
    <div class="screenshots">
      <img src="https://via.placeholder.com/280x160?text=Screenshot+1" alt="Screenshot 1">
      <img src="https://via.placeholder.com/280x160?text=Screenshot+2" alt="Screenshot 2">
      <img src="https://via.placeholder.com/280x160?text=Screenshot+3" alt="Screenshot 3">
    </div>
  </section>

  <footer>
    <p>© 2025 R6 Script | Designed with 💀 by You</p>
  </footer>

  <script>
    // --- Smooth scroll effect for internal links (optional) ---
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });

    // --- Subtle glowing pulse effect on the hero title ---
    const title = document.querySelector('h1');
    setInterval(() => {
      title.style.textShadow = `0 0 ${Math.random()*30}px #00fff6, 0 0 ${Math.random()*50}px #00fff6`;
    }, 500);
  </script>
</body>
</html>
